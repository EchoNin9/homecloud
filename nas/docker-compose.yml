# homecloud NAS stack. Copy .env.example to .env and edit before `docker compose up -d`.
name: homecloud

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host   # needed for device discovery; UI on :8123
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${DATA_ROOT}/homeassistant:/config
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    labels: [wud.watch.digest=true]   # floating tag: the update checker compares digests
    # Local only: published on loopback, reachable by HA/Zigbee2MQTT, never from the LAN.
    ports:
      - "127.0.0.1:1883:1883"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${DATA_ROOT}/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ${DATA_ROOT}/mosquitto/data:/mosquitto/data
    restart: unless-stopped

  zigbee2mqtt:
    profiles: [zigbee]   # enable with: docker compose --profile zigbee up -d
    image: koenkk/zigbee2mqtt:2.14.2
    depends_on: [mosquitto]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${DATA_ROOT}/zigbee2mqtt:/app/data
    devices:
      - ${ZIGBEE_DEVICE:-/dev/ttyUSB0}:/dev/ttyZigbee
    restart: unless-stopped

  bridge:
    build: ./bridge
    image: homecloud-bridge:0.1.0
    labels: [wud.watch=false]   # built locally from this repo; nothing to check
    network_mode: host   # reaches Home Assistant at 127.0.0.1:8123
    environment:
      TZ: ${TZ:-UTC}
      HOME_ID: ${HOME_ID:?set HOME_ID in .env}
      HA_URL: ${HA_URL:-ws://127.0.0.1:8123/api/websocket}
      HA_TOKEN: ${HA_TOKEN:?set HA_TOKEN in .env}
      IOT_ENDPOINT: ${IOT_ENDPOINT:?set IOT_ENDPOINT in .env}
      IOT_THING_NAME: ${IOT_THING_NAME:?set IOT_THING_NAME in .env}
      BRIDGE_ALLOWED_DOMAINS: ${BRIDGE_ALLOWED_DOMAINS:-}
      BRIDGE_ENTITY_EXCLUDE: ${BRIDGE_ENTITY_EXCLUDE:-}
      BRIDGE_ALLOWED_SERVICES: ${BRIDGE_ALLOWED_SERVICES:-}
      BRIDGE_CERT_DIR: /certs
    volumes:
      - ${DATA_ROOT}/bridge/certs:/certs:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [homeassistant]
    restart: unless-stopped

  # DNS ad-blocker on its own LAN IP (macvlan), because DSM's DNS Server already owns :53 on the
  # NAS's addresses. UI and first-run wizard: http://${ADGUARD_IP}:3000. Setup: docs/synology.md.
  # ponytail: macvlan containers can't reach their parent NIC's host IP; that's why the parent is a
  # spare NIC (eth3), so AdGuard can still forward the local zone to DSM DNS on bond0.
  adguard:
    profiles: [adguard]   # enable with: docker compose --profile adguard up -d
    image: adguard/adguardhome:v0.107.79
    networks:
      lan:
        ipv4_address: ${ADGUARD_IP:-}
    volumes:
      - ${DATA_ROOT}/adguard/conf:/opt/adguardhome/conf
      - ${DATA_ROOT}/adguard/work:/opt/adguardhome/work
    restart: unless-stopped

  # Mirrors each container's state into HA as sensor.docker_<name> (contract.md "NAS container sensors").
  # ponytail: the Docker socket is root-equivalent; this runs one fixed script. Use a socket proxy if more joins it.
  monitor:
    image: docker:29-cli
    network_mode: host   # reaches Home Assistant at 127.0.0.1:8123
    environment:
      HA_URL: http://127.0.0.1:8123
      HA_TOKEN: ${HA_TOKEN:?set HA_TOKEN in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/monitor.sh:/monitor.sh:ro
    entrypoint: ["sh", "/monitor.sh"]
    restart: unless-stopped

  # Update checker (What's Up Docker): announces newer images to HA as MQTT `update.*` entities.
  # Notify only: no update trigger is configured and its web UI/API is off, so nothing here can
  # change a container. Upgrade by hand (docs/synology.md "Upgrading").
  wud:
    image: getwud/wud:9.6.0
    network_mode: host   # reaches Mosquitto at 127.0.0.1:1883
    environment:
      TZ: ${TZ:-UTC}
      WUD_SERVER_ENABLED: "false"
      WUD_WATCHER_LOCAL_CRON: "0 6 * * *"   # daily; keeps Docker Hub rate limits happy
      WUD_TRIGGER_MQTT_HA_URL: mqtt://127.0.0.1:1883
      WUD_TRIGGER_MQTT_HA_USER: wud
      WUD_TRIGGER_MQTT_HA_PASSWORD: ${WUD_MQTT_PASSWORD:-}
      WUD_TRIGGER_MQTT_HA_HASS_ENABLED: "true"
      # WUD 9 refuses to start without an admin, even with its server off.
      WUD_AUTH_ADMIN_USER: admin
      WUD_AUTH_ADMIN_PASSWORD: ${WUD_ADMIN_PASSWORD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/wud:/store
    restart: unless-stopped

  # Daily config backup of ${DATA_ROOT} into ${DATA_ROOT}/backups via scripts/backup.sh.
  backup:
    image: debian:bookworm-slim   # GNU tar + bash for backup.sh
    labels: [wud.watch.digest=true]
    environment:
      DATA_ROOT: /data
      BACKUP_DIR: /data/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_AT: ${BACKUP_AT:-03:30}
    volumes:
      - ${DATA_ROOT}:/data:ro
      - ${DATA_ROOT}/backups:/data/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - /etc/localtime:/etc/localtime:ro
    # Sleep until the next BACKUP_AT (local time), back up, repeat.
    command: ["bash", "-c", "while :; do sleep $$(( ($$(date -d \"$$BACKUP_AT\" +%s) - $$(date +%s) + 86400) % 86400 )); bash /backup.sh; sleep 60; done"]
    restart: unless-stopped

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${ADGUARD_PARENT:-eth3}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:-10.0.0.0/24}
          gateway: ${LAN_GATEWAY:-10.0.0.1}
