name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nas/bridge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  cloud:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloud } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - name: validate examples
        run: |
          for d in terraform/examples/*/; do
            (cd "$d" && terraform init -backend=false -input=false && terraform validate)
          done

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: client stays dependency-free (shared with mobile app)
        run: |
          if grep -rnP "from ['\"](?!\./)" src/client --include=*.ts | grep -v '\.test\.ts:'; then
            echo "::error::web/src/client may only import from its own folder"; exit 1
          fi
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --run

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp nas/.env.example nas/.env && docker compose -f nas/docker-compose.yml --env-file nas/.env config -q
      - run: shellcheck nas/scripts/*.sh scripts/*.sh
